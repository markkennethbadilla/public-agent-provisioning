StylesPath = styles
MinAlertLevel = suggestion
Vocab = AgentProvisioning

Packages = Google

[*.md]
BasedOnStyles = Vale, Google

# Generated agent files. rulesync writes these from .rulesync/rules/ and
# .rulesync/skills/, so a fix made here is overwritten by the next
# `rulesync generate` and the gate goes red again for text this repository does
# not hand-edit. The source files under .rulesync/ are linted instead, which is
# where a fix actually survives.
#
# One section per generated shape, and between them they have to cover every
# path rulesync writes. Adding a target to `targets` in rulesync.jsonc adds a
# copy of the same prose under that target's directory, so the brace list below
# grows at the same time. Miss one and Vale lints a file nobody can fix: it
# stays green only for as long as none of its alerts is error level.
#
# .rulesync/** is deliberately absent. That is the source, and the one copy
# worth spending a Vale fix on.
[{AGENTS,CLAUDE}.md]
BasedOnStyles =

[.github/copilot-instructions.md]
BasedOnStyles =

[.cursor/rules/**]
BasedOnStyles =

[{.agents,.claude,.cline,.cursor,.github,.opencode}/skills/**]
BasedOnStyles =

# Curated community skills fetched by `npx rulesync install`. Gitignored,
# pinned in rulesync.lock, and owned by their upstream authors.
[.rulesync/skills/.curated/**]
BasedOnStyles =

# Downloaded, gitignored and owned by somebody else. Vale has no built-in skip
# for these, so without a section here it lints roughly 1,000 files of vendor
# prose and buries the repository's own alerts.
#
#   node_modules   npm packages
#   styles         `vale sync` output, the Google package itself
#   .trunk         Trunk's plugin and tool cache
[node_modules/**]
BasedOnStyles =

[styles/**]
BasedOnStyles =

[.trunk/**]
BasedOnStyles =
